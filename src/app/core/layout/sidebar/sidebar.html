<div class="sidebar">
  <div class="brand">
    <div class="brand-text">
      <span class="brand-movi">MOVI</span><span class="brand-lockers">LOCKERS</span>
    </div>
  </div>

  <div class="nav">
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5 12 3l9 6.5"></path>
        <path d="M5 10v10h14V10"></path>
      </svg>
      Inicio
    </a>

    <!-- Clientes: ADMIN y USUARIO -->
    <a class="nav-item" routerLink="/clientes" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      Clientes
    </a>

    

    <!-- Cotizaciones: ADMIN y USUARIO -->
    <a class="nav-item" routerLink="/cotizaciones" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
        <path d="M14 2v6h6"></path>
        <path d="M9 13h6M9 17h6"></path>
      </svg>
      Cotizaciones
    </a>

    <!-- Reportes: solo ADMIN -->
    @if (auth.isAdmin()) {
      <a class="nav-item" routerLink="/reportes" routerLinkActive="active">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"></path>
          <rect x="7" y="12" width="3" height="6"></rect>
          <rect x="13" y="8" width="3" height="10"></rect>
          <path d="M18 5h1v13"></path>
        </svg>
        Reportes
      </a>
    }
  </div>

  <div class="sidebar-footer">
    <a class="logout" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <path d="M16 17l5-5-5-5"></path>
        <path d="M21 12H9"></path>
      </svg>
      Cerrar sesión
    </a>
  </div>
</div>
