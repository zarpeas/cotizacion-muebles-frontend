@if (confirmService.dialog(); as dialog) {
  <div class="modal-overlay" (click)="confirmService.cancelar()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      <div class="modal-icon" [class.danger]="dialog.danger">
        @if (dialog.danger) {
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 16v-4"></path>
            <path d="M12 8h.01"></path>
          </svg>
        }
      </div>

      <h3 class="modal-title">{{ dialog.title }}</h3>
      <p class="modal-message">{{ dialog.message }}</p>

      <div class="modal-actions">
        <button type="button" class="btn btn-outline" (click)="confirmService.cancelar()">
          {{ dialog.cancelText }}
        </button>
        <button type="button"
                class="btn"
                [class.btn-danger]="dialog.danger"
                [class.btn-primary]="!dialog.danger"
                (click)="confirmService.aceptar()">
          {{ dialog.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
