<div class="login-page">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-card">
    <div class="login-brand">
      <img src="logo-movilockers.png" alt="Movilockers" class="login-logo">
    </div>

    <h2>Iniciar sesión</h2>
    <p class="subtitle">Ingresa tus credenciales para continuar</p>

    <div class="form-field">
      <label>Usuario</label>
      <input type="text" formControlName="username" autocomplete="username" placeholder="tu.usuario">
      @if (form.get('username')?.invalid && form.get('username')?.touched) {
        <small>El usuario es obligatorio</small>
      }
    </div>

    <div class="form-field">
      <label>Contraseña</label>
      <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••">
      @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <small>La contraseña es obligatoria</small>
      }
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="loading()">
      {{ loading() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>

<app-toast></app-toast>
